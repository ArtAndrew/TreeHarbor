name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - name: Verify the GitHub queue acceptance workload
        run: python3 scripts/test-github-queue-fixture.py
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  postgres:
    name: PostgreSQL contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: treeharbor_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: treeharbor_test
        ports:
          - 5432:5432
        volumes:
          - /var/run/treeharbor-test-pg:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -U treeharbor_test -d treeharbor_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.99.1 --profile minimal
      - name: Run real database contracts (not mocks)
        env:
          TH_TEST_DATABASE_URL: host=127.0.0.1 user=treeharbor_test password=disposable-ci-only dbname=treeharbor_test
          TH_SERVICE_TEST_DATABASE_URL: host=/var/run/treeharbor-test-pg user=treeharbor_test password=disposable-ci-only dbname=treeharbor_test
        run: cargo test -p treeharbor-metadata -p treeharbor-materializer -p treeharbor-node -p treeharbor-service --locked -- --ignored
      - name: Install pinned webhook TLS proxy for acceptance
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p webhook-caddy
          curl --fail --location --retry 3 --output webhook-caddy/caddy.tar.gz https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz
          echo '727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b  webhook-caddy/caddy.tar.gz' | sha256sum --check --strict
          tar -xzf webhook-caddy/caddy.tar.gz -C webhook-caddy caddy LICENSE
      - name: Exercise actual webhook TLS, failure recovery and ingress limits
        env:
          TH_CADDY_BIN: ${{ runner.temp }}/webhook-caddy/caddy
          TH_SERVICE_TEST_DATABASE_URL: host=/var/run/treeharbor-test-pg user=treeharbor_test password=disposable-ci-only dbname=treeharbor_test
        run: python3 scripts/test-webhook-proxy.py
  runtime:
    name: ${{ matrix.check }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: x86_64
            check: gVisor task supervision
            sha256: 180dd277f657c1478f09490e8a9a595f7378257510b43d1d3694a769aef9ed02
          - os: ubuntu-24.04-arm
            arch: aarch64
            check: gVisor task supervision (arm64)
            sha256: fd174120b7048ad01c550d1a7cf7336895e8fc986bc1526f636dcaca4791c330
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: 1
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: treeharbor_test
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: treeharbor_test
        volumes:
          - /var/run/treeharbor-runtime-pg:/var/run/postgresql
        options: >-
          --health-cmd "pg_isready -U treeharbor_test -d treeharbor_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install static Rust target
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target ${{ matrix.arch }}-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install -y musl-tools
      - name: Install pinned gVisor including sidecar binaries
        working-directory: ${{ runner.temp }}
        run: |
          test "$(uname -m)" = '${{ matrix.arch }}'
          curl --fail --location --retry 3 --output gvisor.tar.bz2 https://github.com/google/gvisor/releases/download/release-20261012.0/gvisor-${{ matrix.arch }}.tar.bz2
          echo '${{ matrix.sha256 }}  gvisor.tar.bz2' | sha256sum --check --strict
          sudo tar -xjf gvisor.tar.bz2 -C /usr/local/bin
          sudo /usr/local/bin/runsc install
          sudo systemctl restart docker
          /usr/local/bin/runsc --version
          docker info
      - name: Build trusted init and adversarial fixture
        run: cargo build -p treeharbor-runtime --locked --target ${{ matrix.arch }}-unknown-linux-musl --bins --examples
      - name: Exercise real runtime, resources and process teardown
        run: python3 scripts/test-runtime.py
      - name: Exercise Rust runtime control and lost Engine responses
        run: python3 scripts/test-runtime-controller.py
      - name: Install the actual static release package for lifecycle acceptance
        env:
          TH_PACKAGE_DIR: ${{ runner.temp }}/runtime-package
          TH_EXTRACT_DIR: ${{ runner.temp }}/runtime-package-extracted
          TH_INSTALL_PREFIX: ${{ runner.temp }}/runtime-package-installed
        run: |
          cargo build --locked --release --target ${{ matrix.arch }}-unknown-linux-musl -p treeharbor-service -p treeharbor-runtime --bins
          git status --short --untracked-files=normal
          python3 scripts/package-release.py --target ${{ matrix.arch }}-unknown-linux-musl --bin-dir target/${{ matrix.arch }}-unknown-linux-musl/release --output-dir "$TH_PACKAGE_DIR"
          cd "$TH_PACKAGE_DIR"
          sha256sum --check --strict *.sha256
          mkdir "$TH_EXTRACT_DIR"
          tar -xzf ./*.tar.gz -C "$TH_EXTRACT_DIR"
          package_roots=("$TH_EXTRACT_DIR"/*)
          test "${#package_roots[@]}" -eq 1
          sh "${package_roots[0]}/install.sh" --prefix "$TH_INSTALL_PREFIX"
          "$TH_INSTALL_PREFIX/bin/treeharbor" --version
          printf 'TH_TEST_SERVICE_BINARY=%s/bin/treeharbor\n' "$TH_INSTALL_PREFIX" >> "$GITHUB_ENV"
          printf 'TH_TEST_RUNTIME_INIT=%s/treeharbor-runtime-init\n' "$(dirname "$(realpath "$TH_INSTALL_PREFIX/bin/treeharbor")")" >> "$GITHUB_ENV"
      - name: Exercise actual managed AgentRun lifecycle
        env:
          TH_RUNTIME_PG_CONTAINER: ${{ job.services.postgres.id }}
          TH_RUNTIME_DATABASE_URL: host=/var/run/treeharbor-runtime-pg user=treeharbor_test password=disposable-ci-only dbname=treeharbor_test
        run: python3 scripts/test-managed-runs.py
      - name: Exercise actual native candidate checks and protected publication
        env:
          TH_RUNTIME_PG_CONTAINER: ${{ job.services.postgres.id }}
          TH_RUNTIME_DATABASE_URL: host=/var/run/treeharbor-runtime-pg user=treeharbor_test password=disposable-ci-only dbname=treeharbor_test
        run: python3 scripts/test-native-checks.py
