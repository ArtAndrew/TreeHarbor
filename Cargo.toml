[workspace]
members = ["crates/core", "crates/storage", "crates/history"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.99"
license = "Elastic-2.0"
authors = ["Artishchev Andrey Borisovich"]
publish = false

[workspace.dependencies]
sha2 = "0.11.1"
thiserror = "2"
tempfile = "3"
treeharbor-core = { path = "crates/core" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

