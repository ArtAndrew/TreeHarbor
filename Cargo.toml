[workspace]
members = ["crates/core", "crates/storage", "crates/history", "crates/merge", "crates/metadata", "crates/validation", "crates/materializer", "crates/node", "crates/service", "crates/runtime", "crates/git-bridge", "crates/integrations-github", "crates/github-contract", "crates/github-webhook"]
resolver = "3"

[workspace.package]
version = "0.1.4-alpha.1"
edition = "2024"
rust-version = "1.99"
license = "Elastic-2.0"
authors = ["Artishchev Andrey Borisovich"]
publish = false

[workspace.dependencies]
sha2 = "0.11.1"
thiserror = "2"
tempfile = "3"
treeharbor-core = { path = "crates/core" }
treeharbor-git-bridge = { path = "crates/git-bridge" }
treeharbor-github-contract = { path = "crates/github-contract" }
treeharbor-github = { path = "crates/integrations-github" }
treeharbor-github-webhook = { path = "crates/github-webhook" }
treeharbor-history = { path = "crates/history" }
treeharbor-merge = { path = "crates/merge" }
treeharbor-validation = { path = "crates/validation" }
treeharbor-storage = { path = "crates/storage" }
treeharbor-metadata = { path = "crates/metadata" }
treeharbor-materializer = { path = "crates/materializer" }
treeharbor-node = { path = "crates/node" }
treeharbor-runtime = { path = "crates/runtime" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "signal", "io-util"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1", "with-uuid-1"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
getrandom = "0.4.3"
hyper = { version = "1.12.0", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
deadpool = { version = "0.13.1", features = ["managed", "rt_tokio_1"] }
clap = { version = "4.6.7", features = ["derive"] }
rustix = { version = "1.1.5", features = ["fs", "process"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
