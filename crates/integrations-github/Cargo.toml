[package]
name = "treeharbor-github"
description = "Scoped GitHub App connection for the isolated TreeHarbor bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
zeroize = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
treeharbor-core.workspace = true
treeharbor-git-bridge.workspace = true

[dev-dependencies]
tempfile.workspace = true
base64 = "0.23"

[lints]
workspace = true
