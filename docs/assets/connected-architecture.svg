<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc">
<title id="title">TreeHarbor: parallel AI agent workspaces to GitHub pull requests</title>
<desc id="desc">The Connected preview starts from an exact GitHub revision. Two agents use private workspaces supervised through external gVisor. An external controller can use the local socket or restricted HTTPS with its own runtime. TreeHarbor retains immutable changes and a trusted bridge publishes ordinary GitHub PRs. GitHub owns CI, review and merge. The Rust API, CLI and experimental MCP adapter use PostgreSQL metadata and a separate local source object store. Backup restoration and GitHub reconnection are operator-assisted.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2c6f5e"/></marker></defs>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#182d3b}
.title{font-size:34px;font-weight:700}.heading{font-size:24px;font-weight:700}
.body{font-size:21px}.small{font-size:18px;fill:#4d6271}.label{font-size:16px;letter-spacing:1px;font-weight:700;fill:#2c6f5e}
.white{fill:#fff}.card{fill:#fff;stroke:#cbd8df;stroke-width:1.5}.edge{fill:none;stroke:#2c6f5e;stroke-width:2.5;marker-end:url(#arrow)}
</style>
<rect width="1200" height="1080" rx="22" fill="#f6f8fa"/>
<text x="36" y="43" class="label">TREEHARBOR / SELF-HOSTED / CONNECTED PREVIEW</text>
<text x="36" y="91" class="title">Parallel coding agents. Durable changes. GitHub PRs.</text>
<text x="36" y="127" class="body">Keep your repository and review process. Run the source service in your infrastructure.</text>

<rect x="36" y="198" width="225" height="258" rx="14" class="card"/>
<text x="56" y="233" class="label">01 / PIN THE SOURCE</text>
<text x="56" y="275" class="heading">GitHub revision</text>
<text x="56" y="315" class="small">Exact starting commit</text>
<text x="56" y="345" class="small">Full or sparse files</text>
<text x="56" y="403" class="small">Main remains</text>
<text x="56" y="430" class="small">authoritative in GitHub</text>

<rect x="293" y="174" width="275" height="306" rx="14" fill="#eaf3ef" stroke="#2c6f5e" stroke-dasharray="6 5"/>
<text x="313" y="205" class="label">02 / RUN AGENTS</text>
<rect x="309" y="224" width="243" height="82" rx="10" class="card"/>
<text x="326" y="256" class="heading">Agent A</text>
<text x="326" y="285" class="small">Private workspace</text>
<rect x="309" y="319" width="243" height="82" rx="10" class="card"/>
<text x="326" y="351" class="heading">Agent B</text>
<text x="326" y="380" class="small">Private workspace</text>
<text x="313" y="431" class="small">External gVisor runtime</text>
<text x="313" y="458" class="small">Publisher keys stay outside</text>

<rect x="600" y="198" width="255" height="258" rx="14" class="card"/>
<text x="620" y="233" class="label">03 / KEEP THE CHANGES</text>
<text x="620" y="275" class="heading">ChangeSet A / B</text>
<text x="620" y="315" class="small">Immutable proposal versions</text>
<text x="620" y="345" class="small">Exact base + agent run</text>
<text x="620" y="403" class="small">Retained after</text>
<text x="620" y="430" class="small">workspace cleanup</text>

<rect x="887" y="198" width="277" height="258" rx="14" class="card"/>
<text x="907" y="233" class="label">04 / PUBLISH VIA BRIDGE</text>
<text x="907" y="275" class="heading">GitHub pull requests</text>
<text x="907" y="315" class="small">Ordinary draft PRs</text>
<text x="907" y="345" class="small">Your existing CI and review</text>
<text x="907" y="403" class="small">GitHub controls conflicts</text>
<text x="907" y="430" class="small">and merge into main</text>
<path d="M261 328 H290" class="edge"/><path d="M568 328 H597" class="edge"/><path d="M855 328 H884" class="edge"/>

<rect x="36" y="508" width="1128" height="85" rx="14" class="card"/>
<text x="56" y="541" class="heading">Already have an agent runtime? Use external API tasks.</text>
<text x="56" y="573" class="small">Your controller supplies isolation. Connect through the local socket or restricted HTTPS.</text>

<rect x="36" y="621" width="1128" height="99" rx="14" fill="#182d3b"/>
<text x="56" y="658" class="heading white">Rust source and change engine · authenticated API / CLI · experimental MCP stdio</text>
<text x="56" y="694" class="body white">Scoped access · exact revision identities · durable operation records · Git import / export</text>
<path d="M306 720 V753" class="edge"/><path d="M872 720 V753" class="edge"/>
<rect x="36" y="756" width="548" height="94" rx="14" class="card"/>
<text x="56" y="791" class="heading">PostgreSQL metadata</text>
<text x="56" y="822" class="small">Task state · proposal lineage · check and recovery records</text>
<rect x="608" y="756" width="556" height="94" rx="14" class="card"/>
<text x="628" y="791" class="heading">Local immutable object storage</text>
<text x="628" y="822" class="small">Source snapshots · accepted changes · retained history</text>

<rect x="36" y="878" width="1128" height="90" rx="14" fill="#eaf3ef" stroke="#a7c4b8"/>
<text x="56" y="913" class="heading">Operator-assisted recovery</text>
<text x="56" y="945" class="small">Cold backup → quarantined restore → source reconciliation → reviewed GitHub reconnection</text>
<text x="36" y="1008" class="small">Alpha: manual Linux setup. Full publication / queue disaster recovery and production operation remain open.</text>
<text x="36" y="1043" class="small">Standalone shares the Rust core; its complete Git-free workflow remains experimental.</text>
</svg>
