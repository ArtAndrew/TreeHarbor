<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1000" viewBox="0 0 1080 1000" role="img" aria-labelledby="title desc">
<title id="title">TreeHarbor alpha.1 architecture: exact GitHub source to isolated agents and ordinary PRs</title>
<desc id="desc">A source commit feeds two private native workspaces in an external gVisor runtime. The Rust control plane retains immutable changes linked to their base and run, and a trusted bridge publishes GitHub PRs. PostgreSQL holds metadata; a separate local object store holds source and accepted proposals. GitHub owns checks, review and main. Standalone is experimental and outside alpha.1.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2c6f5e"/></marker></defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;fill:#182d3b}.title{font-size:34px;font-weight:700}.heading{font-size:24px;font-weight:650}.body{font-size:20px}.small{font-size:17px;fill:#4d6271}.white{fill:#fff}.edge{fill:none;stroke:#2c6f5e;stroke-width:2.5;marker-end:url(#arrow)}</style>
<rect x="0" y="0" width="1080" height="1000" rx="22" fill="#f6f8fa"/>

