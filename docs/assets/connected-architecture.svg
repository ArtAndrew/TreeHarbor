<text x="50" y="324" class="small">Pinned revision</text>
<text x="50" y="353" class="small">Selected repository</text>
<text x="50" y="402" class="small">GitHub remains</text>
<text x="50" y="427" class="small">authority for main</text>
<rect x="280" y="150" width="236" height="370" rx="14" fill="#eaf3ef" stroke="#2c6f5e" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="296" y="181" class="body">02 · Agent workspaces</text>
<text x="296" y="205" class="small">External gVisor runtime</text>
<rect x="294" y="224" width="208" height="110" rx="14" fill="#fff" stroke="#cbd8df" stroke-width="1.5"/>
<text x="310" y="255" class="heading">Agent A</text>
<text x="310" y="283" class="small">Private workspace</text>
<text x="310" y="309" class="small">Bounded CPU / RAM</text>
<rect x="294" y="352" width="208" height="110" rx="14" fill="#fff" stroke="#cbd8df" stroke-width="1.5"/>
<text x="310" y="383" class="heading">Agent B</text>
<text x="310" y="411" class="small">Private workspace</text>
<text x="310" y="437" class="small">Bounded CPU / RAM</text>
<text x="296" y="494" class="small">Native files · no .git</text>
<text x="296" y="514" class="small">No publisher credentials</text>
<rect x="550" y="210" width="214" height="240" rx="14" fill="#fff" stroke="#cbd8df" stroke-width="1.5"/>
<text x="568" y="247" class="heading">03 · Changes</text>
<text x="568" y="285" class="body">ChangeSet A / B</text>
<text x="568" y="324" class="small">Immutable versions</text>
<text x="568" y="353" class="small">Exact base + run</text>
<text x="568" y="402" class="small">Retained after</text>
<text x="568" y="427" class="small">workspace cleanup</text>
<rect x="798" y="135" width="250" height="47" rx="14" fill="#eaf3ef" stroke="#a7c4b8" stroke-width="1.5"/>
<text x="814" y="165" class="small">Trusted bridge publishes</text>
<rect x="798" y="210" width="250" height="240" rx="14" fill="#fff" stroke="#cbd8df" stroke-width="1.5"/>
<text x="816" y="247" class="heading">04 · GitHub PRs</text>
<text x="816" y="285" class="body">Ordinary draft PRs</text>
<text x="816" y="324" class="small">Existing CI / review</text>
<text x="816" y="353" class="small">GitHub controls merge</text>
<text x="816" y="402" class="small">No TreeHarbor queue</text>
<text x="816" y="427" class="small">required by alpha.1</text>
<path d="M246 334 H277" class="edge"/>
<path d="M516 334 H547" class="edge"/>
<path d="M764 334 H795" class="edge"/>
<text x="32" y="126" class="small">Workspace files, process isolation and merge permission are separate responsibilities.</text>
<rect x="32" y="580" width="1016" height="85" rx="14" fill="#182d3b" stroke="#182d3b" stroke-width="1.5"/>
<text x="53" y="616" class="heading white">Trusted TreeHarbor control plane · Rust</text>
<text x="53" y="645" class="body white">Authenticated API / CLI · exact identities · capture after stop · Git import / export</text>
<path d="M398 580 V523" class="edge"/>
<path d="M657 580 V453" class="edge"/>
