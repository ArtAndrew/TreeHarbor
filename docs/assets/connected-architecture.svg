<rect x="546" y="722" width="502" height="100" rx="14" fill="#fff" stroke="#cbd8df" stroke-width="1.5"/>
<text x="566" y="758" class="heading">Local immutable object storage</text>
<text x="566" y="790" class="small">Source objects · snapshots · accepted proposals</text>
<path d="M270 665 V719" class="edge"/>
<path d="M797 665 V719" class="edge"/>
<rect x="32" y="864" width="1016" height="83" rx="14" fill="#f1f3f5" stroke="#b4c0c8" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="52" y="897" class="heading">Standalone · later release</text>
<text x="52" y="927" class="small">Native history / refs / checks / integration share the Rust core; experimental today.</text>
<text x="32" y="979" class="small">alpha.1: manual Linux setup · operator-assisted scripted trial · not production readiness</text>
</svg>
